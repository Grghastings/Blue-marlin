name: Daily dashboard update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-update.yml"
      - "scripts/update_procurement.py"
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dashboard-update
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public data
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: python scripts/update_procurement.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated changes
        run: git diff --check

      - name: Commit updated dashboard data
        run: |
          git add procurement.js
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update opportunity dashboard data"
          git push
